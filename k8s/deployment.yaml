apiVersion: apps/v1
kind: Deployment
metadata:
  name: barred-owl
  namespace: biodiversity
  labels:
    app: barred-owl
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: barred-owl
  template:
    metadata:
      labels:
        app: barred-owl
    spec:
      initContainers:
      # Public-repo pattern: the GitHub repo (boettiger-lab/barred-owl) is
      # public, so the pod git-clones the app content from main at startup.
      # To update content:
      #   1. edit index.html / layers-input.json / system-prompt.md / docs.html
      #   2. git commit && git push   (main is the live branch)
      #   3. kubectl rollout restart -f k8s/deployment.yaml
      # (If the repo is later made private again, revert to a ConfigMap-backed
      # load-content init container — see git history for the prior manifest.)
      - name: git-clone
        image: alpine/git:2.52.0
        command:
        - sh
        - -c
        - |
          git clone --depth 1 https://github.com/boettiger-lab/barred-owl.git /tmp/repo
          cp /tmp/repo/index.html /tmp/repo/layers-input.json \
             /tmp/repo/system-prompt.md /tmp/repo/docs.html /usr/share/nginx/html/
          # The shared nginx snippets (glen-ops#340), pinned like the GLEN version.
          git clone --depth 1 --branch nginx-v1 https://github.com/SchmidtDSE/glen-template.git /tmp/glen
          cp /tmp/glen/nginx/* /glen-nginx/
        volumeMounts:
        - name: website-content
          mountPath: /usr/share/nginx/html
        - name: glen-nginx
          mountPath: /glen-nginx
      containers:
      - name: nginx
        image: nginx:1.31.9-alpine
        ports:
        - containerPort: 80
        env:
        - name: TMPDIR
          value: "/tmp"
        # Per-app values for the shared nginx snippets (glen-template nginx/render.sh).
        - name: GLEN_APP
          value: "barred-owl"
        - name: LLM_UPSTREAM
          value: "http://open-llm-proxy.biodiversity.svc.cluster.local:8002"
        - name: MCP_UPSTREAM
          value: "http://mcp-server-duckdb.biodiversity.svc.cluster.local:8000"
        - name: MCP_HOST
          value: "duckdb-mcp.nrp-nautilus.io"
        - name: MCP_TILES_SOURCE
          value: "https://duckdb-mcp.nrp-nautilus.io/tiles/"
        # Same-origin MCP path: nginx proxies it to the shared server and
        # attaches the bearer token, so the browser never holds the token
        # (geo-query#453). Absolute, because GLEN does new URL(mcp_url).
        - name: MCP_SERVER_URL
          value: "https://barred-owl.nrp-nautilus.io/api/mcp"
        - name: MCP_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: duckdb-mcp-auth
              key: MCP_AUTH_TOKEN
        - name: LLM_ENDPOINT
          value: "https://open-llm-proxy.nrp-nautilus.io/v1"
        - name: PROXY_KEY
          valueFrom:
            secretKeyRef:
              name: open-llm-proxy-app-keys
              key: barred-owl
        # Renders the shared snippets and this app's server block, writes
        # config.json, and starts nginx.
        command: ["sh", "/glen-nginx/render.sh"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        - name: website-content
          mountPath: /usr/share/nginx/html
        - name: nginx-template
          mountPath: /nginx-template
          readOnly: true
        - name: nginx-conf-d
          mountPath: /etc/nginx/conf.d
        - name: glen-nginx
          mountPath: /glen-nginx
          readOnly: true
        - name: config-template
          mountPath: /config
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: website-content
        emptyDir: {}
      - name: config-template
        configMap:
          name: barred-owl-config
      - name: nginx-template
        configMap:
          name: barred-owl-nginx
      - name: nginx-conf-d
        emptyDir: {}
      - name: glen-nginx
        emptyDir: {}
